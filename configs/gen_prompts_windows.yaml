# Prompts for clips generated window by window, and the named settings. Each scene is a list of
# legs; a window uses the leg that holds its middle frame. Every leg has two texts: one for
# windows where the segmentation shows water, one for windows where it does not, so the river is
# described only when it is in frame. Weather paragraphs are split the same way.
# No camera instructions. No rooftop water tanks: the model paints them as open water.
water_share_min: 0.01        # a window "shows water" when at least this share of its pixels is water

settings:
  K2: {guidance: 3, weights: [0.5, 0.3, 0.5], edge: rendered}     # depth / edge / segmentation
  t4: {guidance: 3, weights: [1.0, 1.0, null], edge: geometry}    # depth and edge, no segmentation
  w53: {guidance: 3, weights: [0.5, 0.3, null], edge: geometry}   # fog and rain: depth 0.5, edge 0.3, no segmentation

scenes:
  canal-shore-street:
    - to_frame: 320
      with_water: >-
        Real aerial drone footage looking down at an angle on the Hudson River waterfront in Lower
        Manhattan, New York City. The left third of the frame is the wide Hudson River, open water
        stretching to the edge of the image. Along the water's edge runs a straight grey granite
        seawall topped by a narrow boardwalk of weathered grey-brown wooden planks. Beside it lies a
        broad waterfront esplanade paved with large pale grey stone and concrete slabs, flat, clean
        and dry, crossed by darker paved footpaths, with people walking and standing on it. To the
        right of the esplanade a pale concrete sidewalk carries a row of leafy green street trees.
        Beyond it runs West Street, a wide multi-lane highway of dark grey asphalt with white dashed
        lane lines and white striped crosswalks, divided by a raised concrete median planted with
        small trees. Cars, yellow taxis and vans drive along the highway.
      without_water: >-
        Real aerial drone footage looking down at an angle on a waterfront esplanade in Lower
        Manhattan, New York City. A broad esplanade paved with large pale grey stone and concrete
        slabs, flat, clean and dry, is crossed by darker paved footpaths, with people walking and
        standing on it. Beside it a pale concrete sidewalk carries a row of leafy green street
        trees. Beyond it runs West Street, a wide multi-lane highway of dark grey asphalt with white
        dashed lane lines and white striped crosswalks, divided by a raised concrete median planted
        with small trees. Cars, yellow taxis and vans drive along the highway.
    - to_frame: 520
      with_water: >-
        Real aerial drone footage looking down at an angle on West Street beside the Hudson River in
        Lower Manhattan, New York City. A wide multi-lane highway of dark grey asphalt fills the
        middle of the frame, with white dashed lane lines, white striped crosswalks at the
        intersection and a raised concrete median planted with small trees. Pale concrete sidewalks
        run along both sides. On one side lie a paved stone esplanade and a strip of open river
        water; on the other a small park with a green lawn and leafy tree canopies, and mid-rise
        office buildings with glass and stone facades. Cars, yellow taxis and vans cross the
        intersection and pedestrians wait at the kerbs.
      without_water: >-
        Real aerial drone footage looking down at an angle on West Street in Lower Manhattan, New
        York City. A wide multi-lane highway of dark grey asphalt fills the middle of the frame,
        with white dashed lane lines, white striped crosswalks at the intersection and a raised
        concrete median planted with small trees. Pale concrete sidewalks run along both sides.
        Beside the highway are a paved stone plaza, a small park with a green lawn and leafy tree
        canopies, and mid-rise office buildings with glass and stone facades. Cars, yellow taxis and
        vans cross the intersection and pedestrians wait at the kerbs.
    - to_frame: 100000
      with_water: &canal_street >-
        Real aerial drone footage looking down at an angle along Canal Street in Lower Manhattan,
        New York City. Mid-rise brick, stone and glass buildings six to twelve storeys tall stand
        on both sides, with regular rows of rectangular windows and flat grey rooftops carrying
        vents and mechanical equipment. Between them runs a city street of dark grey asphalt with a
        yellow centre line, white lane lines and white striped crosswalks, edged by pale concrete
        sidewalks. A small triangular park with a green lawn and dense leafy tree canopies sits
        beside the street. Cars are parked along the kerbs, and cars and yellow taxis drive along
        the street; pedestrians walk on the sidewalks.
      without_water: *canal_street
  120-broadway:
    - to_frame: 100000
      with_water: &broadway >-
        Real aerial drone footage looking down at an angle on the Financial District of Lower
        Manhattan, New York City. Tall stone, brick and glass office towers stand close together
        on both sides, with rows of rectangular windows, carved stone facades and flat rooftops
        carrying vents and mechanical equipment. Between them run narrow city streets of dark grey
        asphalt with white lane lines and white striped crosswalks, edged by pale concrete
        sidewalks. Small paved plazas of grey stone open between the buildings, with a few street
        trees. Cars, yellow taxis, vans and buses drive along the streets and are parked at the
        kerbs, and pedestrians walk on the sidewalks and across the plazas.
      without_water: *broadway
  hudson-park-run:
    - to_frame: 100000
      with_water: >-
        Real aerial drone footage looking down at an angle on Hudson River Park on the west side of
        Lower Manhattan, New York City. The left of the frame is the wide Hudson River, open water
        reaching the edge of the image. A large flat pier deck of pale grey concrete reaches out
        over the water, with people walking and standing on it and a low two-storey park building
        with rows of windows at its edge. Along the shore runs a straight grey granite seawall and
        a waterfront promenade paved with pale grey stone slabs, bordered by a narrow path of
        grey-brown wooden planks. To the right runs West Street, a wide multi-lane highway of dark
        grey asphalt with white dashed lane lines and white striped crosswalks, lined by a pale
        concrete sidewalk and a row of leafy green street trees. Cars, yellow taxis, vans and a
        delivery truck drive along the highway.
      without_water: >-
        Real aerial drone footage looking down at an angle on Hudson River Park on the west side of
        Lower Manhattan, New York City. A large flat deck of pale grey concrete has people walking
        and standing on it and a low two-storey park building with rows of windows at its edge.
        Beside it runs a promenade paved with pale grey stone slabs, bordered by a narrow path of
        grey-brown wooden planks. To the right runs West Street, a wide multi-lane highway of dark
        grey asphalt with white dashed lane lines and white striped crosswalks, lined by a pale
        concrete sidewalk and a row of leafy green street trees. Cars, yellow taxis, vans and a
        delivery truck drive along the highway.

weather:
  clear:
    with_water: >-
      A clear sunny afternoon. Bright sunlight casts crisp shadows from the trees, people and
      vehicles. The river is deep blue-green with small ripples and sparkling highlights. Real
      camera footage from a drone, photorealistic, natural colours, fine surface detail.
    without_water: >-
      A clear sunny afternoon. Bright sunlight casts crisp shadows from the trees, people and
      vehicles. Real camera footage from a drone, photorealistic, natural colours, fine surface
      detail.
  snow:
    with_water: >-
      A heavy snowfall in winter. A thick, even layer of fresh white snow covers the paving, the
      lawns, the kerbs, the roofs of the buildings and the roofs of the parked cars, and lines the
      branches of the trees. The road asphalt is wet and dark where tyres have cleared it. The
      river is dull grey under a flat overcast sky. The light is cold and diffuse with no shadows,
      and snowflakes drift through the air. Real camera footage from a drone, photorealistic,
      natural muted winter colours, fine surface detail.
    without_water: >-
      A heavy snowfall in winter. A thick, even layer of fresh white snow covers the paving, the
      lawns, the kerbs, the roofs of the buildings and the roofs of the parked cars, and lines the
      branches of the trees. The road asphalt is wet and dark where tyres have cleared it. The sky
      is flat and overcast; the light is cold and diffuse with no shadows, and snowflakes drift
      through the air. Real camera footage from a drone, photorealistic, natural muted winter
      colours, fine surface detail.
  fog:
    with_water: >-
      A foggy morning. Thick grey fog hangs over the whole scene: nearby surfaces are clear but
      pale, and everything farther away fades into soft grey haze with low contrast. The paving and
      the road are damp and darker than usual. The river is flat grey and disappears into the mist.
      The light is dim, soft and diffuse with no shadows. Real camera footage from a drone,
      photorealistic, muted natural colours, fine surface detail.
    without_water: >-
      A foggy morning. Thick grey fog hangs over the whole scene: nearby surfaces are clear but
      pale, and everything farther away fades into soft grey haze with low contrast. The paving and
      the road are damp and darker than usual. The light is dim, soft and diffuse with no shadows.
      Real camera footage from a drone, photorealistic, muted natural colours, fine surface detail.
  rain:
    with_water: >-
      Heavy rain under a dark overcast sky. Every surface is soaking wet: the paving and the road
      asphalt are dark and glossy with puddles and mirror-like reflections, and the roofs shine with
      rain. Raindrops ring the surface of the grey river. Vehicles have their headlights on and
      leave spray behind them. The light is dim and flat with no shadows. Real camera footage from
      a drone, photorealistic, muted natural colours, fine surface detail.
    without_water: >-
      Heavy rain under a dark overcast sky. Every surface is soaking wet: the paving and the road
      asphalt are dark and glossy with puddles and mirror-like reflections, and the roofs shine with
      rain. Vehicles have their headlights on and leave spray behind them. The light is dim and
      flat with no shadows. Real camera footage from a drone, photorealistic, muted natural
      colours, fine surface detail.
